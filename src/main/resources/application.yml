server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://config-server:8888
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uys_users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: user-service
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  gateway:
    secret: ${GATEWAY_SECRET}
  bootstrap:
    internal-users: false   # Keycloak entegrasyonu — internal kullanıcı bootstrap devre dışı
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8090}
    realm: uys
    admin-username: ${KEYCLOAK_ADMIN:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    client-id: admin-cli

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
