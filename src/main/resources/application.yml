server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://config-server:8888
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uys_users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:tav-uys-super-secret-key-minimum-32-bytes-long!}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
