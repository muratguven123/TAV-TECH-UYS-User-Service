server:
  port: 8081
  ssl:
    enabled: true
    bundle: service-mtls

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://config-server:8888
  ssl:
    bundle:
      jks:
        service-mtls:
          keystore:
            location: classpath:certs/keystore.p12
            password: changeit
            type: PKCS12
          truststore:
            location: classpath:certs/truststore.p12
            password: changeit
            type: PKCS12
          client:
            auth: need   # mTLS: client sertifikası zorunlu

eureka:
  client:
    service-url:
      defaultZone: https://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
    secure-port-enabled: true
    secure-port: 8081
    non-secure-port-enabled: false

app:
  gateway:
    secret: ${GATEWAY_SECRET:tav-gateway-internal-secret-change-in-prod}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uys_users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}
      timeout: 2000ms

app.jwt:
  secret: ${JWT_SECRET:tav-uys-super-secret-key-minimum-32-bytes-long!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
